<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コスト比較シミュレーター</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden">
        
        <!-- Header section -->
        <div class="bg-blue-600 text-white p-6 text-center">
            <h1 class="text-2xl font-bold">コスト比較シミュレーター</h1>
            <p class="text-blue-100 text-sm mt-2">現在の契約、レンタル、購入のコストを比較します</p>
        </div>

        <div class="p-6 sm:p-8">
            <div class="space-y-6">
                <!-- Current Contract Amount Input -->
                <div>
                    <label for="currentCost" class="block text-sm font-medium text-gray-700 mb-1">現在の契約金額 (円)</label>
                    <div class="relative">
                        <input type="text" id="currentCost" value="100000" inputmode="numeric" class="w-full pl-4 pr-8 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all text-right font-medium text-gray-900" placeholder="例: 100,000">
                        <span class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500">円</span>
                    </div>
                </div>

                <!-- Rental Quote Input -->
                <div>
                    <label for="rentalCost" class="block text-sm font-medium text-gray-700 mb-1">見積レンタル金額 (円)</label>
                    <div class="relative">
                        <input type="text" id="rentalCost" value="80000" inputmode="numeric" class="w-full pl-4 pr-8 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all text-right font-medium text-gray-900" placeholder="例: 80,000">
                        <span class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500">円</span>
                    </div>
                </div>

                <!-- Purchase Quote Input -->
                <div>
                    <label for="purchaseCost" class="block text-sm font-medium text-gray-700 mb-1">見積購入金額 (円)</label>
                    <div class="relative">
                        <input type="text" id="purchaseCost" value="300000" inputmode="numeric" class="w-full pl-4 pr-8 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all text-right font-medium text-gray-900" placeholder="例: 300,000">
                        <span class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500">円</span>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div id="resultsArea" class="mt-8 pt-6 border-t border-gray-200 hidden">
                <h2 class="text-lg font-semibold text-gray-800 mb-4 text-center">比較結果</h2>
                
                <!-- Chart Container -->
                <div class="w-full h-64 mb-6">
                    <canvas id="costChart"></canvas>
                </div>

                <!-- Difference Summaries -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Vs Rental -->
                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                        <p class="text-sm text-gray-600 mb-1">現在の契約 → <span class="font-bold text-blue-700">レンタル</span></p>
                        <p id="diffRental" class="text-xl font-bold text-gray-900 text-center py-2">-- 円</p>
                        <p id="diffRentalDesc" class="text-xs text-center text-gray-500"></p>
                    </div>
                    
                    <!-- Vs Purchase -->
                    <div class="bg-green-50 p-4 rounded-xl border border-green-100">
                        <p class="text-sm text-gray-600 mb-1">現在の契約 → <span class="font-bold text-green-700">購入</span></p>
                        <p id="diffPurchase" class="text-xl font-bold text-gray-900 text-center py-2">-- 円</p>
                        <p id="diffPurchaseDesc" class="text-xs text-center text-gray-500"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const currentCostInput = document.getElementById('currentCost');
        const rentalCostInput = document.getElementById('rentalCost');
        const purchaseCostInput = document.getElementById('purchaseCost');
        const resultsArea = document.getElementById('resultsArea');
        const diffRentalElement = document.getElementById('diffRental');
        const diffRentalDesc = document.getElementById('diffRentalDesc');
        const diffPurchaseElement = document.getElementById('diffPurchase');
        const diffPurchaseDesc = document.getElementById('diffPurchaseDesc');
        
        let costChart = null;

        // Formatter for currency
        const formatter = new Intl.NumberFormat('ja-JP');

        // Helper: Remove non-numeric characters
        const parseNumber = (val) => {
            const parsed = parseInt(val.toString().replace(/[^\d]/g, ''), 10);
            return isNaN(parsed) ? 0 : parsed;
        };

        // Helper: Format input value on typing
        const formatInput = (e) => {
            let val = parseNumber(e.target.value);
            if (val === 0 && e.target.value === '') {
                e.target.value = '';
            } else {
                e.target.value = formatter.format(val);
            }
            calculateDiffs();
        };

        // Add event listeners
        currentCostInput.addEventListener('input', formatInput);
        rentalCostInput.addEventListener('input', formatInput);
        purchaseCostInput.addEventListener('input', formatInput);

        // Calculate differences and update UI
        function calculateDiffs() {
            const current = parseNumber(currentCostInput.value);
            const rental = parseNumber(rentalCostInput.value);
            const purchase = parseNumber(purchaseCostInput.value);

            // Show results area if at least current cost is entered
            if (current > 0) {
                resultsArea.classList.remove('hidden');
            } else {
                resultsArea.classList.add('hidden');
                return;
            }

            // Calculate differences (Current - New)
            // Positive means savings, Negative means extra cost
            const diffRental = current - rental;
            const diffPurchase = current - purchase;

            // Update UI for Rental
            updateDiffUI(diffRentalElement, diffRentalDesc, diffRental, rental);

            // Update UI for Purchase
            updateDiffUI(diffPurchaseElement, diffPurchaseDesc, diffPurchase, purchase);

            // Update Chart
            updateChart(current, rental, purchase);
        }

        function updateDiffUI(element, descElement, diffAmount, newAmount) {
            if (newAmount === 0 && document.activeElement !== currentCostInput) {
                element.innerHTML = '-- 円';
                element.className = 'text-xl font-bold text-gray-400 text-center py-2';
                descElement.innerText = '金額を入力してください';
                return;
            }

            const absDiff = Math.abs(diffAmount);
            const formattedDiff = formatter.format(absDiff);

            if (diffAmount > 0) {
                // Savings
                element.innerHTML = `-${formattedDiff} <span class="text-sm font-normal">円</span>`;
                element.className = 'text-xl font-bold text-blue-600 text-center py-2';
                descElement.innerText = 'のコスト削減になります';
            } else if (diffAmount < 0) {
                // Extra cost
                element.innerHTML = `+${formattedDiff} <span class="text-sm font-normal">円</span>`;
                element.className = 'text-xl font-bold text-red-500 text-center py-2';
                descElement.innerText = 'のコスト増になります';
            } else {
                // Same
                element.innerHTML = `±0 <span class="text-sm font-normal">円</span>`;
                element.className = 'text-xl font-bold text-gray-600 text-center py-2';
                descElement.innerText = '金額は同じです';
            }
        }

        function updateChart(current, rental, purchase) {
            const ctx = document.getElementById('costChart').getContext('2d');
            
            const data = {
                labels: ['現在の契約', 'レンタル', '購入'],
                datasets: [{
                    label: '金額 (円)',
                    data: [current, rental, purchase],
                    backgroundColor: [
                        'rgba(156, 163, 175, 0.7)', // Gray for current
                        'rgba(59, 130, 246, 0.8)',  // Blue for rental
                        'rgba(16, 185, 129, 0.8)'   // Green for purchase
                    ],
                    borderColor: [
                        'rgb(107, 114, 128)',
                        'rgb(37, 99, 235)',
                        'rgb(5, 150, 105)'
                    ],
                    borderWidth: 1,
                    borderRadius: 4
                }]
            };

            const config = {
                type: 'bar',
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.y !== null) {
                                        label += new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY' }).format(context.parsed.y);
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value, index, values) {
                                    // Format y-axis labels
                                    if (value >= 10000) {
                                        return (value / 10000) + '万';
                                    }
                                    return value;
                                }
                            }
                        }
                    }
                }
            };

            // Destroy existing chart to prevent rendering over it
            if (costChart) {
                costChart.destroy();
            }

            costChart = new Chart(ctx, config);
        }

        // Format initial values
        currentCostInput.value = formatter.format(parseNumber(currentCostInput.value));
        rentalCostInput.value = formatter.format(parseNumber(rentalCostInput.value));
        purchaseCostInput.value = formatter.format(parseNumber(purchaseCostInput.value));

        // Initial calculation on load
        window.onload = function() {
            calculateDiffs();
        };

    </script>
</body>
</html>
